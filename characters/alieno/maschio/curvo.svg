<svg xmlns="http://www.w3.org/2000/svg" viewBox="840 205 273 702" width="273" height="702" role="img" aria-labelledby="t">
  <title id="t">Curvo</title>
  <style>
    /* Ogni colore è una variabile CSS con un valore di default: il file funziona da solo
       e il visualizzatore può ricolorare le parti sovrascrivendo le variabili. */
    .c-stroke   { stroke: var(--outline, #15100c); stroke-width: var(--line-w, 3.5); stroke-linecap: round; stroke-linejoin: round }
    .c-fine     { stroke-width: calc(var(--line-w, 3.5) * 0.75) }
    .c-open     { fill: none }
    .c-fold     { stroke-opacity: .4 }
    .c-skin     { fill: var(--skin, #bed0a7) }
    .c-shirt    { fill: var(--shirt, #f8f5ee) }
    .c-pants    { fill: var(--pants, #5d5d5d) }
    .c-eye      { fill: var(--eye, #000000) }
    .c-dot      { fill: var(--outline, #15100c) }

    /* Parti: il visualizzatore le nasconde con --show-alien-NOME (inline | none). */
    #alien-head  { display: var(--show-alien-head, inline) }
    #alien-torso { display: var(--show-alien-torso, inline) }
    #alien-arm-left, #alien-arm-right { display: var(--show-alien-arms, inline) }
    #alien-pants { display: var(--show-alien-pants, inline) }
    #alien-legs  { display: var(--show-alien-legs, inline) }

    /* Idle: respiro (busto e braccia si allungano di ~1%, la testa segue con un leggero ritardo)
       + battito di ciglia. Solo transform, ancorati alla base di ogni gruppo.
       --idle-n = 0 spegne tutto; --idle-delay sfasa più istanze tra loro. */
    .c-alien-torso, .c-alien-arm, .c-alien-head, .c-alien-blink {
      transform-box: fill-box;
      animation-duration: 1.9s;
      animation-timing-function: ease-in-out;
      animation-direction: alternate;
      animation-iteration-count: var(--idle-n, infinite);
      animation-delay: var(--idle-delay, 0s);
    }
    .c-alien-torso { transform-origin: 50% 100%; animation-name: alien-breathe }
    .c-alien-arm   { transform-origin: 50% 100%; animation-name: alien-arms }
    .c-alien-head  { transform-origin: 50% 100%; animation-name: alien-head; animation-delay: calc(var(--idle-delay, 0s) + 0.14s) }
    .c-alien-blink { transform-origin: 50% 50%; animation-name: alien-blink; animation-duration: 4.6s; animation-direction: normal; animation-timing-function: linear }
    @keyframes alien-breathe { from { transform: scaleY(1) }   to { transform: scaleY(1.014) } }
    @keyframes alien-arms    { from { transform: scaleY(1) }   to { transform: scaleY(1.01) } }
    @keyframes alien-head    { from { transform: translateY(0) rotate(0deg) } to { transform: translateY(-2px) rotate(-0.5deg) } }
    @keyframes alien-blink   { 0%, 90%, 100% { transform: scaleY(1) } 94% { transform: scaleY(0.08) } }
    @media (prefers-reduced-motion: reduce) {
      .c-alien-torso, .c-alien-arm, .c-alien-head, .c-alien-blink { animation-iteration-count: var(--idle-n, 0) }
    }
  </style>

  <!-- Stessa scala e stessa linea del suolo (y = 900) per tutte le sagome aliene (e per quelle umane), quindi le altezze restano confrontabili. -->
