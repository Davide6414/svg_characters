<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personaggi · Visualizzatore SVG</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f4f1; --panel: #ffffff; --ink: #1e1c1a; --muted: #6b665f; --line: #e3e0da;
    --accent: #3a5bd9; --accent-ink: #ffffff; --soft: #eeece7;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151418; --panel: #201e24; --ink: #efece7; --muted: #a29c94; --line: #36333c;
      --accent: #8ba0ff; --accent-ink: #11131c; --soft: #2a2830;
    }
  }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", Roboto, sans-serif }
  button, input { font: inherit; color: inherit }
  button { cursor: pointer }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

  .top { max-width: 1280px; margin: 0 auto; padding: 22px 20px 0 }
  .top h1 { margin: 0; font-size: 22px; letter-spacing: -.01em }
  .top p { margin: 2px 0 0; color: var(--muted) }

  .layout { max-width: 1280px; margin: 0 auto; padding: 16px 20px 28px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start }
  @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr) } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius) }

  /* barra strumenti */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 12px }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel) }
  .seg button { border: 0; background: none; padding: 6px 12px; display: inline-flex; align-items: center; gap: 7px }
  .seg button + button { border-left: 1px solid var(--line) }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
  .sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(128,128,128,.55); flex: none }
  .sw[data-bg="white"] { background: #fff }
  .sw[data-bg="check"] { background: conic-gradient(#d9dbe0 25%, #fff 0 50%, #d9dbe0 0 75%, #fff 0) 0 0 / 8px 8px }
  .sw[data-bg="gray"] { background: #cdd2d9 }
  .sw[data-bg="dark"] { background: #1b1d22 }
  .zoom { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); margin-left: auto }
  .zoom input { width: 130px; accent-color: var(--accent) }
  .zoom output { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink) }

  /* palco */
  .stage { --zoom: 1; min-height: 600px; overflow: auto; padding: 24px; display: grid; place-items: center; border-radius: var(--radius); border: 1px solid var(--line); container-type: inline-size }
  .stage[data-bg="white"] { background: #fff }
  .stage[data-bg="check"] { background: conic-gradient(#e8e9ed 25%, #fff 0 50%, #e8e9ed 0 75%, #fff 0) 0 0 / 24px 24px }
  .stage[data-bg="gray"] { background: #cdd2d9 }
  .stage[data-bg="dark"] { background: #1b1d22; --cap: #c9c5be }
  .figures { display: flex; align-items: flex-end; justify-content: center; gap: clamp(8px, 2vw, 28px); margin: auto }
  .figures svg { display: block; width: auto; overflow: visible }
  .figures.single svg { height: calc(min(560px, 66vh) * var(--zoom)) }
  /* figure affiancate: una riga per gruppo. L'altezza è limitata dalla larghezza del palco e dal numero di righe
     (--ar = altezza/larghezza del riquadro, --cols e --rows impostate da JS; 30px a colonna = spazi e margini) */
  .figures.all { flex-direction: column; align-items: center; gap: 14px }
  .figures.all svg { height: calc(min(400px, 48vh / var(--rows, 1), (100cqw - 30px * var(--cols, 5)) / var(--cols, 5) * var(--ar, 2.2)) * var(--zoom)) }
  .group { display: grid; justify-items: center; gap: 4px }
  .group-label { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--cap, #55514b) }
  .row { display: flex; align-items: flex-end; justify-content: center; gap: clamp(8px, 2vw, 28px) }
  .fig { border: 0; background: none; padding: 6px 4px 8px; border-radius: 12px; display: grid; justify-items: center; gap: 6px; color: var(--cap, #55514b) }
  .fig span { font-size: 13px }
  .fig[aria-pressed="true"] { background: rgba(58, 91, 217, .12); box-shadow: inset 0 0 0 2px var(--accent); color: inherit }
  .fig:hover { background: rgba(128, 128, 128, .12) }

  /* varianti */
  .variants { display: grid; gap: 12px; margin-top: 12px }
  .variants[hidden] { display: none }
  .vgroup h3, .bodies h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted) }
  .vrow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px }      /* 5 sagome per riga */
  @media (max-width: 560px) { .vrow { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
  .bodies { display: grid; gap: 10px }
  .variant { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px 8px; display: grid; justify-items: center; gap: 4px }
  .variant svg { height: 96px; width: auto }
  .variant span { font-size: 13px; color: var(--muted) }
  .variant[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset }
  .variant[aria-pressed="true"] span { color: var(--ink); font-weight: 600 }
  .variant:hover { background: var(--soft) }

  /* pannello */
  .panel { padding: 16px 18px 18px; position: sticky; top: 16px }
  @media (max-width: 900px) { .panel { position: static } }
  .panel h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted) }
  .panel h2 + * { margin-top: 0 }
  .panel section + section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line) }
  #variant-name { color: var(--ink) }
  .colors { display: grid; gap: 14px }
  .cgroup { display: grid; gap: 10px }
  .cgroup h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted) }
  .color { display: grid; grid-template-columns: 34px 1fr 88px 28px; align-items: center; column-gap: 10px; row-gap: 5px }
  .color label { font-size: 14px }
  .swatches { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 4px }
  .swatch { width: 16px; height: 16px; padding: 0; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .2); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); cursor: pointer }
  .swatch:hover, .swatch:focus-visible { transform: scale(1.18) }
  .undo { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer }
  .undo:hover { background: var(--soft); color: var(--ink) }
  .undo.off { visibility: hidden }
  .quick { display: grid; grid-template-columns: 54px 1fr; align-items: center; gap: 10px; font-size: 13px; color: var(--muted) }
  .quick .swatches { grid-column: auto }
  .color-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px }
  .color-actions .btn { padding: 6px 10px; font-size: 13px }
  input[type="color"] { width: 34px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; cursor: pointer }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px }
  input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 6px }
  input[type="color"]::-moz-color-swatch { border: 0; border-radius: 6px }
  .hex { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px }
  .hex[aria-invalid="true"] { border-color: #d64545 }
  .row { display: flex; align-items: center; gap: 10px }
  .row input[type="range"] { flex: 1; accent-color: var(--accent) }
  .row output { min-width: 2.6em; text-align: right; font-variant-numeric: tabular-nums }
  .parts { display: flex; flex-wrap: wrap; gap: 8px }
  .parts label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; user-select: none }
  .parts label:has(input:checked) { background: var(--soft) }
  .parts input { accent-color: var(--accent); margin: 0 }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
  .btn { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel) }
  .btn:hover { background: var(--soft) }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600 }
  .btn.primary:hover { filter: brightness(1.06) }
  .btn.wide { grid-column: 1 / -1 }
  .hint { margin: 12px 0 0; font-size: 13px; color: var(--muted) }
  kbd { padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; font: 12px ui-monospace, Consolas, monospace }

  #toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; transition: .2s }
  #toast.show { opacity: 1; transform: translate(-50%, 0) }

  /* visibilità delle parti: pilotata da variabili CSS ereditate dall'istanza <use>
     (maglia, pantaloni, braccia e i capi che li sostituiscono sono in src/human/style.css) */
  #head { display: var(--show-head, inline) }
  #shoes { display: var(--show-shoes, inline) }

  /* sezioni della pagina: una scheda per tipo di sagoma (umani, alieni), ognuna con la sua anteprima e il suo pannello */
  .tabs { display: flex; gap: 6px; margin-top: 14px; border-bottom: 1px solid var(--line) }
  .tabs button { border: 0; background: none; padding: 8px 16px 9px; margin-bottom: -1px; border-bottom: 3px solid transparent; font-weight: 600; color: var(--muted) }
  .tabs button:hover { color: var(--ink) }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
  .section[hidden] { display: none }
  .lead { max-width: 1280px; margin: 0 auto; padding: 12px 20px 0; color: var(--muted) }
</style>
</head>
<body>
<header class="top">
  <h1>Personaggi</h1>
  <nav class="tabs" role="tablist" aria-label="Tipo di sagoma" id="section-tabs">
    <button type="button" role="tab" id="tab-human" data-section="human" aria-controls="section-human" aria-selected="true">Umani</button>
    <button type="button" role="tab" id="tab-alien" data-section="alien" aria-controls="section-alien" aria-selected="false" tabindex="-1">Alieni</button>
  </nav>
</header>
