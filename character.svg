<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 655" width="250" height="655" role="img" aria-labelledby="t">
  <title id="t">Personaggio base</title>
  <style>
    /* Ogni colore è una variabile CSS con un valore di default: il file funziona da solo
       e il visualizzatore può ricolorare le parti sovrascrivendo le variabili. */
    .c-stroke   { stroke: var(--outline, #15100c); stroke-width: var(--line-w, 5.4); stroke-linecap: round; stroke-linejoin: round }
    .c-fine     { stroke-width: calc(var(--line-w, 5.4) * 0.75) }
    .c-open     { fill: none }
    .c-skin     { fill: var(--skin, #fec79e) }
    .c-shirt    { fill: var(--shirt, #f2ece7) }
    .c-pants    { fill: var(--pants, #5b6679) }
    .c-upper-l  { fill: var(--shoe-upper-l, #322b27) }
    .c-upper-r  { fill: var(--shoe-upper-r, #322b27) }
    .c-toe      { fill: var(--shoe-toe, #f5ede7) }
    .c-tongue   { fill: var(--shoe-tongue, #f5ede7) }
    .c-lace     { stroke: var(--shoe-lace, #f5ede7); stroke-width: 4; fill: none }
    .c-sole     { fill: var(--shoe-sole, #f5efea) }
    .c-sole-rim { fill: var(--outline, #15100c) }
    .c-eye      { fill: var(--eye, #1a1613) }

    /* Idle: respiro (busto e braccia si allungano di ~1%, la testa segue con un leggero ritardo)
       + battito di ciglia. Solo transform, ancorati alla base di ogni gruppo.
       --idle-n = 0 spegne tutto; --idle-delay sfasa più istanze tra loro. */
    .c-idle-torso, .c-idle-arm, .c-idle-head, .c-blink {
      transform-box: fill-box;
      animation-duration: 1.9s;
      animation-timing-function: ease-in-out;
      animation-direction: alternate;
      animation-iteration-count: var(--idle-n, infinite);
      animation-delay: var(--idle-delay, 0s);
    }
    .c-idle-torso { transform-origin: 50% 100%; animation-name: idle-breathe }
    .c-idle-arm   { transform-origin: 50% 100%; animation-name: idle-arms }
    .c-idle-head  { transform-origin: 50% 100%; animation-name: idle-head; animation-delay: calc(var(--idle-delay, 0s) + 0.14s) }
    .c-blink      { transform-origin: 50% 50%; animation-name: idle-blink; animation-duration: 4.6s; animation-direction: normal; animation-timing-function: linear }
    @keyframes idle-breathe { from { transform: scaleY(1) }   to { transform: scaleY(1.014) } }
    @keyframes idle-arms    { from { transform: scaleY(1) }   to { transform: scaleY(1.01) } }
    @keyframes idle-head    { from { transform: translateY(0) rotate(0deg) } to { transform: translateY(-2px) rotate(-0.5deg) } }
    @keyframes idle-blink   { 0%, 90%, 100% { transform: scaleY(1) } 94% { transform: scaleY(0.08) } }
    @media (prefers-reduced-motion: reduce) {
      .c-idle-torso, .c-idle-arm, .c-idle-head, .c-blink { animation-iteration-count: var(--idle-n, 0) }
    }
  </style>

  <!-- Le coordinate sono quelle dell'immagine di riferimento; il gruppo le riporta a 0,0. -->
  <g transform="translate(-40 -240)">

    <!-- Braccio destro (lato destro dell'immagine): dietro ai pantaloni -->
    <g id="arm-right" class="c-idle-arm">
      <path class="c-skin c-stroke" d="M226,530 L229.5,540 L241,600 C243,610 245,614 248,620 C252,627 253,636 251,645 C249,652 245,657 240,661 C234,665 228,667 222,668 L205,672 L205,525 Z"/>
    </g>

    <!-- Pantaloni: sagoma unica con le due gambe, cucitura centrale e pieghe all'orlo -->
    <g id="pants">
      <!-- riempimento: scende sotto le scarpe, così l'orlo non si vede -->
      <path class="c-pants" d="M106,612 C102,640 98,662 94.5,680 L71,812 L66,818 L64.5,826 L65,848 L100,851 L134,852 L134.5,848 L136.5,842 L142,832 L140,818 L141,810 L155,720 L161,704 L164,720 L165,740 L165.5,810 L164.5,818 L161.5,826 L161,834 L165.5,841 L166.5,850 L237,852 L236.5,820 L235,812 L230.5,800 L214.5,612 Z"/>
      <!-- contorni: lato esterno sinistro, interno delle gambe, lato esterno destro -->
      <path class="c-open c-stroke" d="M106,612 C102,640 98,662 94.5,680 L71,812 L66,818 L64.5,826 L65,842"/>
      <path class="c-open c-stroke" d="M134.5,848 L136.5,842 L142,832 L140,818 L141,810 L155,720 L161,704 L164,720 L165,740 L165.5,810 L164.5,818 L161.5,826 L161,834 L165.5,841 L166.5,850"/>
      <path class="c-open c-stroke" d="M237,842 L236.5,820 L235,812 L230.5,800 L214.5,612"/>
      <path class="c-open c-stroke" d="M161,704 L163,680 L165,660 Q167.5,652 177,647"/>
      <path class="c-open c-stroke c-fine" d="M92,813 Q104,807 119,817"/>
      <path class="c-open c-stroke c-fine" d="M188,821 Q202,814 216,810"/>
    </g>

    <!-- Scarpe: sinistra frontale, destra in tre quarti con punta e lacci -->
    <g id="shoes">
      <g id="shoe-left">
        <path class="c-sole-rim" d="M49,864 L137.5,864 L137.5,878 C137.5,884 132,888.5 124,888.5 L63,888.5 C54,888.5 49,884 49,876 Z"/>
        <rect class="c-sole" x="54.5" y="868.5" width="77" height="15" rx="4"/>
        <path class="c-upper-l c-stroke" d="M52.5,865 C58.5,853 72,832 92,830.2 C112,829 127,840 134,855 C137,860 138,863 137,865 Z"/>
        <path class="c-tongue c-stroke c-fine" d="M77,843 L102,836 L111,840 L112,845 L84,848 Z"/>
      </g>
      <g id="shoe-right">
        <path class="c-sole-rim" d="M166,862 L274,858 C280,858 282,864 279.5,870 C276,877 266,880 252,881 L190,884 C174,885 166,880 166,872 Z"/>
        <path class="c-sole" d="M171,864 L269,861.5 C273,862 274,865 272,868 C269,872 262,874 250,875 L192,878 C178,879 171,876 171,871 Z"/>
        <path class="c-upper-r c-stroke" d="M168,862 C167,853 170,848 176,846.5 C186,844 194,841 200,836.5 C205,832 209,828 214,827 C222,826 232,826 238,828 C246,832 254,838 262,843 C268,846 273,850 275,855 C276,857 276.5,859 276,860 Z"/>
        <path class="c-lace" d="M214,835 L233,831.5 M218,841 L239,837 M223,846 L244,842"/>
        <path class="c-toe c-stroke c-fine" d="M222,861 C222,856 225,853 229.5,850 C233,847 238,843.5 250,842 C258,841.5 266,845 270,850 C274,853 276,856 276,860 Z"/>
      </g>
    </g>

    <!-- Braccio sinistro con pugno: davanti ai pantaloni, dietro alla maglia -->
    <g id="arm-left" class="c-idle-arm">
      <path class="c-skin c-stroke" d="M82,525 L78.5,540 L74.5,560 L71.5,580 L69,600 L67.5,612 C62,622 57,636 60,646 C64,658 76,668 90,670 C104,671 118,662 121,646 C122,636 119,628 117,622 L112.5,612 L125,605 L125,525 Z"/>
    </g>

    <!-- Testa + collo: contorno aperto, così restano gli stacchi di mento e orecchio -->
    <g id="head" class="c-idle-head">
      <path class="c-skin" d="M165,421 C190,421 214,412 226,392 C229,386 231,380 232,372 C233,366 241,358 241,340 C242,320 240,300 233,287 C224,270 204,255 180,251 C172,250 166,250 160,250 C140,250 115,258 100,278 C90,291 82,308 81,322 C80,334 81,344 83,351 C77,352 74,358 74.5,368 C74.5,382 80,396 95,402 C102,404 110,404 114,403 L122.5,410 L129.5,414 L134.5,418 L136,421 L136,462 L171,462 L171,421 Z"/>
      <path class="c-open c-stroke" d="M165,421 C190,421 214,412 226,392 C229,386 231,380 232,372 C233,366 241,358 241,340 C242,320 240,300 233,287 C224,270 204,255 180,251 C172,250 166,250 160,250 C140,250 115,258 100,278 C90,291 82,308 81,322 C80,334 81,344 83,351 C77,352 74,358 74.5,368 C74.5,382 80,396 95,402 C102,404 110,404 114,403 L122.5,410 L129.5,414 L134.5,418 L136,421 L136,447"/>
      <path class="c-open c-stroke" d="M171,423 L171.5,445"/>
      <path class="c-open c-stroke c-fine" d="M83,354 C91,347 105,348 110,360"/>
      <ellipse class="c-eye c-blink" cx="173" cy="357" rx="6" ry="19"/>
      <ellipse class="c-eye c-blink" cx="213.5" cy="357" rx="6" ry="19"/>
    </g>

    <!-- Maglia: busto, maniche corte, scollo tondo, cuciture delle maniche -->
    <g id="torso" class="c-idle-torso">
      <path class="c-shirt c-stroke" d="M130,438 C116,438 103,448 96,460 C88,472 80,495 70,528 C80,532 100,537 123,543 L117,549 L112.5,614 Q165,624 217,614 L213.5,555 L211,538 C219,535 228,533 237,531 C234,516 225,492 214.5,470 C209,458 196,444 179,440 C178,462 138,462 130,438 Z"/>
      <path class="c-open c-stroke" d="M128,496 L123,543"/>
      <path class="c-open c-stroke" d="M206,490 L211,538"/>
    </g>
  </g>
</svg>
